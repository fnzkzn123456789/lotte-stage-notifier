name: Lotte Stage Notifier

on:
  schedule:
    - cron: '2-57/5 * * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: 'test: 텔레그램 연결 / dry-run: 조회만 / check: 감시 1회'
        required: true
        default: dry-run
        type: choice
        options:
          - dry-run
          - test
          - check

permissions:
  contents: write

concurrency:
  group: lotte-stage-notifier
  cancel-in-progress: false

jobs:
  notify:
    # 무료 운영 보호: 비공개 저장소에서는 실행하지 않습니다.
    # 예약 실행은 Secrets 등록 후 MONITOR_ENABLED=true로 직접 켭니다.
    if: >-
      github.event.repository.private == false &&
      (github.event_name == 'workflow_dispatch' || vars.MONITOR_ENABLED == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Check out code
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Check and notify
        env:
          PYTHONUTF8: '1'
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GITHUB_TOKEN: ${{ github.token }}
          RUN_MODE: ${{ inputs.mode || 'check' }}
        run: python -m notifier.cloud --mode "$RUN_MODE" --github-state --sweep-count 180 --days 28 --max-seconds 220
